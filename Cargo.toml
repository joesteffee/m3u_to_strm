[package]
name = "m3u-to-strm"
version = "2.0.1"
edition = "2021"
rust-version = "1.85"
description = "Convert an M3U playlist into STRM files for Emby/Jellyfin"
license = "MIT"

[[bin]]
name = "m3u-to-strm"
path = "src/main.rs"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
regex = "1"
ureq = "2"

[dev-dependencies]
serde_json = "1"
tempfile = "3"

# Static-linked, no debug symbols, LTO: small scratch-container binary and fast startup.
[profile.release]
codegen-units = 1
lto = "fat"
opt-level = 3
panic = "abort"
strip = true
