name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Lint and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: Swatinem/rust-cache@v2

      - name: Add rustfmt and clippy
        run: rustup component add rustfmt clippy

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets --all-features --locked -- -D warnings

      # Unit tests, the Python-parity replay (tests/fixtures/parity.json) and the end-to-end
      # pipeline tests against a local playlist + mock Emby server.
      - name: Test
        run: cargo test --all-targets --locked

  build:
    name: Release build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --release --locked
      - name: Smoke test
        run: ./target/release/m3u-to-strm --version && ./target/release/m3u-to-strm --help
